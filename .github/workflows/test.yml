name: Flutter Test

on:
  push:
    branches:
      - '**'  # runs on push to any branch

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subsosito/flutter-action@v2
        with:
          flutter-version: '3.12.2'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test